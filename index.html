<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050806">
<meta name="description" content="Juegos Nilson MM: Empires & Allies y CityVille. Juega en el navegador, en tu PC o en tu celular.">
<title>Juegos Nilson MM</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="img/icono64.png">
<link rel="apple-touch-icon" href="img/icono180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --verde: #7ac142; --verde2: #a4dc72; --texto: #f2f5ef; --tenue: #b6c0b5; --rojo: #e5534b; --oro: #f2b33d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; color: var(--texto); background: #050806; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button, a.accion { font-family: inherit; }

  .fondo { position: fixed; inset: -80px; background-size: cover; background-position: center top; filter: blur(28px) saturate(1.2); opacity: 0; transition: opacity .8s ease; }
  .fondo.ver { opacity: .55; }
  .velo { position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(5,8,6,.92) 0%, rgba(5,8,6,.65) 45%, rgba(5,8,6,.35) 100%), linear-gradient(0deg, rgba(5,8,6,.95) 0%, rgba(5,8,6,0) 45%); }

  header { position: fixed; left: 56px; right: 56px; top: 26px; display: flex; align-items: center; gap: 14px; z-index: 5; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo svg { filter: drop-shadow(0 0 6px rgba(122,193,66,.7)); flex: none; }
  .logo-txt { display: flex; flex-direction: column; gap: 3px; }
  .logo-sup { font-family: Orbitron, "Segoe UI", sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 9px; color: var(--verde2); }
  .logo-neon { font-family: Orbitron, "Segoe UI", sans-serif; font-size: 30px; font-weight: 800; letter-spacing: 3px; line-height: 1; color: #e9ffd9; white-space: nowrap;
    text-shadow: 0 0 8px rgba(122,193,66,.9), 0 0 22px rgba(122,193,66,.6); }
  .logo-neon em { font-style: normal; color: var(--verde); }
  .espacio { flex: 1; }
  .redondo { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: var(--texto);
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
  .pildora { height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: var(--texto);
    font-size: 13px; font-weight: 600; cursor: pointer; flex: none; }
  .redondo:hover, .pildora:hover, .perfil:hover { background: rgba(122,193,66,.22); border-color: var(--verde); }
  :focus-visible { outline: 2px solid var(--verde2); outline-offset: 2px; }
  .perfil { height: 44px; padding: 0 16px 0 4px; border-radius: 22px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: var(--texto);
    cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; flex: none; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #e08a1e; color: #1a1205; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .hora { display: flex; flex-direction: column; align-items: flex-end; margin-left: 6px; }
  .hora b { font-size: 22px; font-weight: 300; line-height: 1.1; }
  .hora span { font-size: 12px; color: var(--tenue); }

  nav.juegos { position: fixed; left: 56px; top: 118px; display: flex; align-items: flex-end; gap: 18px; z-index: 4; }
  .icono { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; cursor: pointer; opacity: .78; transition: opacity .2s; background: none; border: 0; color: inherit; padding: 0; }
  .icono .caja { width: 104px; height: 104px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: center; transition: width .25s, height .25s, box-shadow .25s, border-color .25s; }
  .icono .caja img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .icono span { font-size: 13px; color: #c4cdc3; }
  .icono.foco { opacity: 1; }
  .icono.foco .caja { width: 150px; height: 150px; border: 3px solid var(--verde); box-shadow: 0 0 0 4px rgba(122,193,66,.25), 0 18px 40px rgba(0,0,0,.6); }
  .icono.foco span { font-size: 14px; font-weight: 600; color: var(--texto); }

  section.detalle { position: fixed; left: 56px; top: clamp(330px, 36vh, 420px); width: min(900px, calc(100vw - 560px)); display: flex; flex-direction: column; gap: 14px; z-index: 4; }
  .etiqueta { font-size: 13px; letter-spacing: 3px; color: var(--verde2); font-weight: 600; }
  .detalle h1 { margin: 0; font-size: 56px; font-weight: 300; line-height: 1; }
  .datos { display: flex; flex-wrap: wrap; gap: 18px; font-size: 14px; color: #c4cdc3; align-items: center; min-height: 20px; }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: #8a948a; display: inline-block; margin-right: 8px; }
  .punto.on { background: #5fd47a; box-shadow: 0 0 0 4px rgba(95,212,122,.18); }
  .punto.off { background: var(--rojo); box-shadow: 0 0 0 4px rgba(229,83,75,.18); }
  .punto.mant { background: var(--oro); box-shadow: 0 0 0 4px rgba(242,179,61,.18); }
  .acciones { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .accion { height: 58px; padding: 0 24px; border-radius: 29px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: var(--texto);
    font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
    transition: transform .15s, background .15s; }
  .accion:hover { background: rgba(255,255,255,.16); transform: translateY(-2px); }
  .accion.principal { padding: 0 34px; border: 0; background: #f2f5ef; color: #0b120c; font-size: 18px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .accion.principal:hover { background: #fff; }
  .accion.apagada { opacity: .45; }
  .insignia { font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 3px 7px; border-radius: 4px; }
  .insignia.pc { background: var(--verde); color: #0b120c; } .insignia.apk { background: #e08a1e; color: #1a1205; }
  .mini-nota { font-size: 13px; color: var(--tenue); min-height: 18px; }

  aside.novedades { position: fixed; right: 56px; top: clamp(330px, 36vh, 420px); width: 400px; max-height: calc(100vh - clamp(330px, 36vh, 420px) - 70px); display: flex; flex-direction: column; gap: 12px; z-index: 4; }
  .novedades .etiqueta { color: var(--oro); }
  .lista-nov { display: flex; flex-direction: column; gap: 12px; overflow: auto; padding-right: 4px; }
  .nov { padding: 16px 18px; border-radius: 14px; background: rgba(12,16,13,.82); border: 1px solid rgba(255,255,255,.10); display: flex; flex-direction: column; gap: 6px; }
  .nov small { font-size: 12px; color: var(--tenue); } .nov b { font-size: 16px; font-weight: 600; } .nov p { margin: 0; font-size: 13px; color: #c4cdc3; line-height: 1.45; }

  .toast { position: fixed; right: 56px; top: 96px; width: 380px; max-width: calc(100vw - 32px); display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px;
    background: rgba(16,124,16,.94); box-shadow: 0 18px 40px rgba(0,0,0,.5); z-index: 30; transform: translateX(440px); opacity: 0; transition: transform .35s ease, opacity .35s; }
  .toast.ver { transform: none; opacity: 1; }
  .toast.mal { background: rgba(150,40,36,.95); }
  .toast .ic { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; flex: none; }
  .toast b { font-size: 14px; display: block; } .toast span { font-size: 13px; color: #e8f5e1; }

  footer { position: fixed; left: 56px; right: 56px; bottom: 22px; display: flex; gap: 22px; font-size: 13px; color: var(--tenue); align-items: center; z-index: 5; flex-wrap: wrap; }
  .tecla { display: inline-block; padding: 1px 7px; border-radius: 4px; border: 1px solid rgba(255,255,255,.22); color: var(--texto); }
  .tecla.a { background: #2e7d32; border-color: #4caf50; } .tecla.y { background: #b28704; border-color: #fbc02d; }

  .modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .modal-fondo.ver { display: flex; }
  .modal { width: min(440px, 100%); background: rgba(14,20,15,.97); border: 1px solid rgba(255,255,255,.12); border-top: 3px solid var(--verde); border-radius: 12px;
    padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .modal h2 { margin: 0; font-weight: 400; font-size: 24px; } .modal label { font-size: 13px; color: var(--tenue); }
  .modal input { width: 100%; font: inherit; font-size: 16px; color: var(--texto); background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 11px 12px; }
  .modal input:focus { outline: none; border-color: var(--verde); }
  .modal .fila { display: flex; gap: 10px; justify-content: flex-end; }

  #arranque { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle at 50% 46%, rgba(122,193,66,.28) 0%, rgba(16,124,16,.10) 28%, transparent 55%), #030504;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; transition: opacity .6s ease; padding: 16px; text-align: center; }
  #arranque.fuera { opacity: 0; pointer-events: none; }
  #arranque .aro { width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(122,193,66,.55);
    box-shadow: 0 0 40px rgba(122,193,66,.45), inset 0 0 30px rgba(122,193,66,.25); animation: aparecer .7s ease both; }
  #arranque .nombre { display: flex; flex-direction: column; align-items: center; gap: 8px; animation: encender 1.1s .25s both; }
  #arranque .sup { font-family: Orbitron, sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 16px; color: var(--verde2); padding-left: 16px; }
  #arranque .gran { font-family: Orbitron, sans-serif; font-size: clamp(36px, 9vw, 72px); font-weight: 800; letter-spacing: 6px; line-height: 1; color: #e9ffd9;
    text-shadow: 0 0 10px rgba(122,193,66,.95), 0 0 30px rgba(122,193,66,.65), 0 0 70px rgba(122,193,66,.4); }
  #arranque .gran em { font-style: normal; color: var(--verde); }
  #arranque .barra { width: 220px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 18px; }
  #arranque .barra div { height: 4px; width: 0; border-radius: 2px; background: linear-gradient(90deg, #3f8f1f, var(--verde2)); box-shadow: 0 0 12px rgba(122,193,66,.8); animation: llenar 1.5s .2s ease forwards; }
  @keyframes aparecer { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes encender { 0% { opacity: 0; } 20% { opacity: .9; } 28% { opacity: .2; } 40% { opacity: 1; } 48% { opacity: .5; } 60%, 100% { opacity: 1; } }
  @keyframes llenar { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { #arranque * { animation: none !important; } #arranque .barra div { width: 100%; } }

  /* ----- PC con ventana angosta: novedades debajo del juego ----- */
  @media (min-width: 901px) and (max-width: 1250px) {
    section.detalle { width: calc(100vw - 112px); }
    aside.novedades { left: 56px; right: auto; width: min(560px, calc(100vw - 112px)); top: calc(clamp(330px, 36vh, 420px) + 290px); max-height: calc(100vh - clamp(330px, 36vh, 420px) - 360px); }
  }

  /* ----- celular y pantallas chicas: todo en columna y con scroll ----- */
  @media (max-width: 900px) {
    body { overflow-y: auto; }
    .velo { background: linear-gradient(180deg, rgba(5,8,6,.5) 0%, rgba(5,8,6,.75) 35%, rgba(5,8,6,.97) 60%); }
    main.pantalla { position: relative; z-index: 4; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 20px;
      padding: max(18px, env(safe-area-inset-top)) 18px max(23px, env(safe-area-inset-bottom)); }
    header, nav.juegos, section.detalle, aside.novedades, footer { position: static; left: auto; right: auto; top: auto; bottom: auto; width: auto; max-height: none; }
    header { gap: 8px; }
    .logo { gap: 10px; } .logo svg { width: 34px; height: 34px; }
    .logo-sup { font-size: 8px; letter-spacing: 6px; } .logo-neon { font-size: 19px; letter-spacing: 2px; }
    .hora, #btnSonido { display: none; }
    .perfil { padding: 0; width: 40px; height: 40px; justify-content: center; border: 0; background: none; } .perfil #perfilNombre { display: none; }
    .pildora { height: 36px; padding: 0 12px; font-size: 12px; }
    nav.juegos { gap: 12px; margin-top: 6px; }
    .icono .caja { width: 72px; height: 72px; border-radius: 12px; }
    .icono.foco .caja { width: 96px; height: 96px; border-radius: 14px; }
    .icono span { font-size: 12px; } .icono.foco span { font-size: 12px; }
    section.detalle { margin-top: 36px; gap: 10px; padding-top: 0; }
    .detalle h1 { font-size: 34px; line-height: 1.05; }
    .etiqueta { font-size: 11px; }
    .acciones { flex-direction: column; gap: 10px; margin-top: 6px; }
    .accion { height: 52px; width: 100%; font-size: 15px; }
    .accion.principal { font-size: 17px; }
    aside.novedades { gap: 10px; }
    .lista-nov { overflow: visible; }
    .nov { padding: 13px 15px; }
    footer { justify-content: center; font-size: 11px; margin-top: auto; }
    #ayuda { display: none; }
    .toast { right: 16px; left: 16px; width: auto; top: auto; bottom: 16px; transform: translateY(140px); }
    .toast.ver { transform: none; }
  }
</style>
</head>
<body>
<div id="arranque" aria-hidden="true">
  <div class="aro"><svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#a4dc72" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4"/><path d="M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.96 3.46l-.7 5.05A3 3 0 0 0 5 17c1 0 1.5-.5 2-1l1.4-1.4A2 2 0 0 1 9.83 14h4.34a2 2 0 0 1 1.42.59L17 16c.5.5 1 1 2 1a3 3 0 0 0 2.96-3.49l-.7-5.05A4 4 0 0 0 17.3 5Z"/></svg></div>
  <div class="nombre"><span class="sup">JUEGOS</span><span class="gran">NILSON <em>MM</em></span></div>
  <div class="barra"><div></div></div>
</div>

<div class="fondo" id="fondoA"></div><div class="fondo" id="fondoB"></div><div class="velo"></div>

<main class="pantalla">
<header>
  <div class="logo">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7ac142" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h4M8 9v4"/><path d="M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.96 3.46l-.7 5.05A3 3 0 0 0 5 17c1 0 1.5-.5 2-1l1.4-1.4A2 2 0 0 1 9.83 14h4.34a2 2 0 0 1 1.42.59L17 16c.5.5 1 1 2 1a3 3 0 0 0 2.96-3.49l-.7-5.05A4 4 0 0 0 17.3 5Z"/></svg>
    <div class="logo-txt"><span class="logo-sup">JUEGOS</span><span class="logo-neon">NILSON <em>MM</em></span></div>
  </div>
  <div class="espacio"></div>
  <button class="redondo" id="btnSonido" type="button"></button>
  <button class="pildora" id="btnIdioma" type="button">EN</button>
  <button class="perfil" id="btnPerfil" type="button"><span class="avatar" id="avatar">?</span><span id="perfilNombre"></span></button>
  <div class="hora"><b id="reloj"></b><span id="fecha"></span></div>
</header>

<nav class="juegos" id="juegos" aria-label="Juegos"></nav>

<section class="detalle" aria-live="polite">
  <div class="etiqueta" id="etiqueta"></div>
  <h1 id="titulo"></h1>
  <div class="datos" id="datos"></div>
  <div class="acciones" id="acciones"></div>

</section>

<aside class="novedades" id="novedades" aria-label="Novedades">

  <div class="lista-nov" id="listaNov"></div>
</aside>

<footer><span id="ayuda"></span><span id="pie"></span></footer>
</main>

<div class="toast" id="toast" role="status"><span class="ic" id="toastIc"></span><div><b id="toastTit"></b><span id="toastTxt"></span></div></div>

<div class="modal-fondo" id="modalPerfil">

  </form>
</div>

<script>
// ---------- juegos (los links de MediaFire se actualizan solos desde tu admin cuando el servidor de Empires responde)
const JUEGOS = [
  { nombre: "Empires & Allies", portada: "img/empires.png",
    web: "https://pc-nilson.tail81378e.ts.net/entrar",
    pc: "https://www.mediafire.com/file/bzvn7bl0mvmoyu8/EmpiresAllies-PC.zip/file",
    apk: "https://www.mediafire.com/file/i4cp07bzrj6x7p8/EmpiresAllies-Celular.apk/file",
    estado: "https://pc-nilson.tail81378e.ts.net/api/estado-publico", claves: ["empires_pc", "empires_apk"] },
  { nombre: "CityVille", portada: "img/cityville.png",
    web: "https://cityvillelatino.tail81378e.ts.net",
    pc: "https://www.mediafire.com/file/oy4kft7yiwx88q5/CityVille-Latino-PC-Flash.zip/file",
    apk: "https://www.mediafire.com/file/h4gwv58j9bq5av8/CityVille-Latino-Flash.apk/file",
    ping: "https://cityvillelatino.tail81378e.ts.net/favicon.ico", claves: ["cityville_pc", "cityville_apk"] },
];
const $ = (id) => document.getElementById(id);
const esMovil = () => matchMedia("(max-width: 900px)").matches;
let estado = {}, novedades = [], sel = 0;
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };

// ---------- idioma
let idioma = leer("idioma", (navigator.language || "es").startsWith("en") ? "en" : "es");
const TXT = {
  es: { seguir: "SEGUIR JUGANDO", juego: "JUEGO", web: "▶ Jugar en el navegador", pc: "Descargar para PC", apk: "Descargar app para Android",
        on: "Servidor encendido", off: "Servidor apagado", mant: "En mantenimiento", revisando: "Revisando servidor…", jugando: (n) => n === 1 ? "1 jugando ahora" : n + " jugando ahora",
        hace: (t) => "Jugado " + t, nov: "NOVEDADES", sinNov: "Sin novedades por ahora.",
        ayuda: '<span class="tecla">← →</span> elegir juego &nbsp; <span class="tecla a">Enter</span> jugar', pie: "Guárdalo en tu pantalla de inicio para abrirlo como app",
        elegirNombre: "Tu nombre", mpTit: "¿Cómo te llamas?", mpLbl: "Tu nombre aparecerá arriba a la derecha", cancelar: "Cancelar", guardar: "Guardar",
        sonidoOn: "Silenciar sonidos", sonidoOff: "Activar sonidos", idiomaBtn: "EN", idiomaTit: "Switch to English",
        toastOn: (j) => ["Servidor encendido", j + " ya se puede jugar"], toastOff: (j) => ["Servidor apagado", j + " no está disponible por ahora"],
        notaApagado: "Prueba más tarde o avísale a Nilson", notaWeb: "Funciona en PC y celular, sin instalar nada", hola: (n) => "¡Hola, " + n + "!", momento: "hace un momento",
        abriendo: "Abriendo…", noPermitido: "Desactivado por ahora" },
  en: { seguir: "CONTINUE PLAYING", juego: "GAME", web: "▶ Play in the browser", pc: "Download for PC", apk: "Download Android app",
        on: "Server online", off: "Server offline", mant: "Under maintenance", revisando: "Checking server…", jugando: (n) => n + " playing now",
        hace: (t) => "Played " + t, nov: "NEWS", sinNov: "No news for now.",
        ayuda: '<span class="tecla">← →</span> choose game &nbsp; <span class="tecla a">Enter</span> play', pie: "Add it to your home screen to open it like an app",
        elegirNombre: "Your name", mpTit: "What's your name?", mpLbl: "Your name will show at the top right", cancelar: "Cancel", guardar: "Save",
        sonidoOn: "Mute sounds", sonidoOff: "Turn sounds on", idiomaBtn: "ES", idiomaTit: "Cambiar a español",
        toastOn: (j) => ["Server online", j + " is ready to play"], toastOff: (j) => ["Server offline", j + " is not available right now"],
        notaApagado: "Try again later or let Nilson know", notaWeb: "Works on PC and phone, nothing to install", hola: (n) => "Hi, " + n + "!", momento: "a moment ago",
        abriendo: "Opening…", noPermitido: "Disabled for now" },
};
const t = (k, ...a) => { const v = TXT[idioma][k]; return typeof v === "function" ? v(...a) : v; };

// ---------- sonidos
let sonido = leer("sonido", "si") !== "no", ctx = null;
function tono(f, d, v = 0.05, c = 0) {
  if (!sonido) return;
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(v, ctx.currentTime + c); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + c + d);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + c); o.stop(ctx.currentTime + c + d + 0.02); } catch (e) {}
}
const sMover = () => tono(880, 0.06, 0.035), sElegir = () => { tono(660, 0.09); tono(990, 0.14, 0.05, 0.08); }, sAviso = () => { tono(523, 0.1, 0.04); tono(784, 0.18, 0.04, 0.1); };
const IC_SON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
const IC_MUDO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';

// ---------- estado de los servidores
function conTiempo(promesa, ms) { return Promise.race([promesa, new Promise((_, r) => setTimeout(() => r(new Error("tiempo")), ms))]); }
function ping(url) {
  return new Promise((ok) => { const img = new Image(); const fin = (v) => { img.onload = img.onerror = null; ok(v); };
    img.onload = () => fin(true); img.onerror = () => fin(false); setTimeout(() => fin(false), 8000); img.src = url + "?t=" + Date.now(); });
}
async function revisar() {
  const antes = estado, nuevo = {}, nov = [];
  await Promise.all(JUEGOS.map(async (g) => {
    const info = { encendido: null, jugando: null, mantenimiento: false, permitido: { pc: true, web: true, apk: true } };
    if (g.estado) {
      try {
        const r = await conTiempo(fetch(g.estado + "?t=" + Date.now(), { cache: "no-store" }), 9000);
        const e = await r.json();
        Object.assign(info, { encendido: true, jugando: e.jugando, mantenimiento: !!e.mantenimiento, permitido: e.permitido || info.permitido });
        for (const n of (e.novedades || [])) nov.push(n);
        if (e.links) for (const j of JUEGOS) { const [kpc, kapk] = j.claves; if (e.links[kpc]) j.pc = e.links[kpc]; if (e.links[kapk]) j.apk = e.links[kapk]; }
      } catch (x) { info.encendido = false; }
    } else if (g.ping) info.encendido = await ping(g.ping);
    nuevo[g.nombre] = info;
  }));
  estado = nuevo; novedades = nov;
  for (const j of Object.keys(estado)) { const a = antes[j], b = estado[j]; if (a && a.encendido !== null && a.encendido !== b.encendido) avisoServidor(b.encendido, j); }
  pintarDetalle(); pintarNovedades();
}

// ---------- dibujo
let capa = 0, fondoActual = "";
function cambiarFondo(url) {
  if (url === fondoActual) return; fondoActual = url;
  const sig = capa ? $("fondoA") : $("fondoB"), act = capa ? $("fondoB") : $("fondoA");
  sig.style.backgroundImage = `url("${url}")`; sig.classList.add("ver"); act.classList.remove("ver"); capa = 1 - capa;
}
function pintar() {
  $("juegos").replaceChildren(...JUEGOS.map((g, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "icono" + (i === sel ? " foco" : "");
    b.innerHTML = '<div class="caja"><img alt=""></div><span></span>'; b.querySelector("img").src = g.portada; b.lastChild.textContent = g.nombre;
    b.setAttribute("aria-pressed", i === sel ? "true" : "false");
    b.onclick = () => { if (sel !== i) { sel = i; sMover(); guardar("juegoSel", g.nombre); pintar(); } };
    return b;
  }));
  pintarDetalle(); pintarNovedades();
}
function haceCuanto(seg) {
  const d = Math.max(0, Date.now() / 1000 - seg), rtf = new Intl.RelativeTimeFormat(idioma, { numeric: "auto" });
  if (d < 90) return t("momento"); if (d < 3600) return rtf.format(-Math.round(d / 60), "minute");
  if (d < 86400) return rtf.format(-Math.round(d / 3600), "hour"); return rtf.format(-Math.round(d / 86400), "day");
}
function historial() { try { return JSON.parse(leer("historial", "{}")) || {}; } catch (e) { return {}; } }
function pintarDetalle() {
  const g = JUEGOS[sel]; if (!g) return;
  cambiarFondo(g.portada);
  const h = historial(), ultimo = Object.entries(h).sort((a, b) => b[1] - a[1])[0];
  $("etiqueta").textContent = ultimo && ultimo[0] === g.nombre ? t("seguir") : t("juego");
  $("titulo").textContent = g.nombre;
  const e = estado[g.nombre], datos = $("datos"); datos.replaceChildren();
  let clase = "", txt = t("revisando");
  if (e && e.mantenimiento) { clase = "mant"; txt = t("mant"); }
  else if (e && e.encendido === true) { clase = "on"; txt = t("on") + (typeof e.jugando === "number" ? " · " + t("jugando", e.jugando) : ""); }
  else if (e && e.encendido === false) { clase = "off"; txt = t("off"); }
  const s1 = document.createElement("span"); s1.innerHTML = '<span class="punto ' + clase + '"></span>'; s1.append(txt); datos.append(s1);
  if (h[g.nombre]) { const s2 = document.createElement("span"); s2.textContent = t("hace", haceCuanto(h[g.nombre])); datos.append(s2); }
  const apagado = e && (e.encendido === false || e.mantenimiento), perm = (e && e.permitido) || { pc: true, web: true, apk: true };
  const acc = $("acciones"); acc.replaceChildren();
  const enlace = (html, clase, url, marcar) => {
    const a = document.createElement("a"); a.className = "accion " + clase; a.href = url; a.target = "_blank"; a.rel = "noopener"; a.innerHTML = html;
    a.onclick = () => { sElegir(); if (marcar) { const hh = historial(); hh[g.nombre] = Date.now() / 1000; guardar("historial", JSON.stringify(hh)); setTimeout(pintarDetalle, 300); } };
    acc.append(a);
  };
  enlace(esc(t("web")), "principal" + (apagado || !perm.web ? " apagada" : ""), g.web, true);
  if (!esMovil()) enlace('<span class="insignia pc">PC</span>' + esc(t("pc")), perm.pc ? "" : "apagada", g.pc, false);
  enlace('<span class="insignia apk">APK</span>' + esc(t("apk")), perm.apk ? "" : "apagada", g.apk, false);
  $("nota").textContent = apagado ? t("notaApagado") : t("notaWeb");
}
function pintarNovedades() {
  $("novTit").textContent = t("nov");
  const lista = $("listaNov");
  if (!novedades.length) { const d = document.createElement("div"); d.className = "nov"; const p = document.createElement("p"); p.textContent = t("sinNov"); d.append(p); lista.replaceChildren(d); return; }
  lista.replaceChildren(...novedades.slice(0, 6).map((n) => {
    const a = document.createElement("article"); a.className = "nov";
    const sm = document.createElement("small"); sm.textContent = [n.juego, n.fecha].filter(Boolean).join(" · ");
    const b = document.createElement("b"); b.textContent = n.titulo || ""; a.append(sm, b);
    if (n.texto) { const p = document.createElement("p"); p.textContent = n.texto; a.append(p); }
    return a;
  }));
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---------- avisos
let avisoT;
function mostrarToast(tit, txt, mal) {
  $("toast").classList.toggle("mal", !!mal);
  $("toastIc").innerHTML = mal ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  $("toastTit").textContent = tit; $("toastTxt").textContent = txt || ""; $("toast").classList.add("ver");
  clearTimeout(avisoT); avisoT = setTimeout(() => $("toast").classList.remove("ver"), 4500);
}
function avisoServidor(on, j) { const [a, b] = on ? t("toastOn", j) : t("toastOff", j); sAviso(); mostrarToast(a, b, !on); }

// ---------- perfil (se guarda solo en este navegador)
function pintarPerfil() { const n = leer("nombre", ""); $("avatar").textContent = n ? n[0].toUpperCase() : "?"; $("perfilNombre").textContent = n || t("elegirNombre"); $("btnPerfil").setAttribute("aria-label", n || t("elegirNombre")); }
function abrirPerfil() { $("inNombre").value = leer("nombre", ""); $("modalPerfil").classList.add("ver"); setTimeout(() => $("inNombre").focus(), 50); }
function cerrarPerfil() { $("modalPerfil").classList.remove("ver"); }
$("formPerfil").onsubmit = (ev) => { ev.preventDefault(); const n = $("inNombre").value.replace(/\s+/g, " ").trim().slice(0, 24); if (!n) return; guardar("nombre", n); cerrarPerfil(); pintarPerfil(); mostrarToast(t("hola", n), "", false); };
$("mpCancelar").onclick = cerrarPerfil; $("btnPerfil").onclick = abrirPerfil;

// ---------- textos fijos
function aplicarIdioma() {
  document.documentElement.lang = idioma;
  $("btnIdioma").textContent = t("idiomaBtn"); $("btnIdioma").title = t("idiomaTit"); $("btnIdioma").setAttribute("aria-label", t("idiomaTit"));
  $("btnSonido").innerHTML = sonido ? IC_SON : IC_MUDO; $("btnSonido").title = sonido ? t("sonidoOn") : t("sonidoOff"); $("btnSonido").setAttribute("aria-label", $("btnSonido").title);
  $("ayuda").innerHTML = t("ayuda"); $("pie").textContent = esMovil() ? t("pie") : "";
  $("mpTit").textContent = t("mpTit"); $("mpLbl").textContent = t("mpLbl"); $("mpCancelar").textContent = t("cancelar"); $("mpGuardar").textContent = t("guardar");
  pintarPerfil(); reloj();
}
$("btnIdioma").onclick = () => { idioma = idioma === "en" ? "es" : "en"; guardar("idioma", idioma); aplicarIdioma(); pintar(); };
$("btnSonido").onclick = () => { sonido = !sonido; guardar("sonido", sonido ? "si" : "no"); aplicarIdioma(); sMover(); };
function reloj() { const loc = idioma === "en" ? "en-US" : "es-PE", d = new Date();
  $("reloj").textContent = d.toLocaleTimeString(loc, { hour: "numeric", minute: "2-digit" }); $("fecha").textContent = d.toLocaleDateString(loc, { weekday: "short", day: "numeric", month: "long" }); }
setInterval(reloj, 15000);
matchMedia("(max-width: 900px)").addEventListener("change", () => { aplicarIdioma(); pintarDetalle(); });

// ---------- teclado y mando
function mover(d) { sel = (sel + d + JUEGOS.length) % JUEGOS.length; sMover(); guardar("juegoSel", JUEGOS[sel].nombre); pintar(); }
document.addEventListener("keydown", (e) => {
  if ($("modalPerfil").classList.contains("ver")) { if (e.key === "Escape") cerrarPerfil(); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); mover(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); mover(-1); }
  else if (e.key === "Enter" && !(document.activeElement && /^(A|BUTTON|INPUT)$/.test(document.activeElement.tagName))) { e.preventDefault(); $("acciones").querySelector("a").click(); }
});
const previo = {};
function sondearMando() {
  for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) {
    if (!p) continue; const b = (i) => p.buttons[i] && p.buttons[i].pressed;
    const ahora = { izq: b(14) || p.axes[0] < -0.6, der: b(15) || p.axes[0] > 0.6, a: b(0) }, ant = previo[p.index] || {};
    if (ahora.izq && !ant.izq) mover(-1); if (ahora.der && !ant.der) mover(1); if (ahora.a && !ant.a) $("acciones").querySelector("a").click();
    previo[p.index] = ahora;
  }
  requestAnimationFrame(sondearMando);
}

// ---------- inicio
(function iniciar() {
  const guardado = leer("juegoSel", ""), h = historial(), ultimo = Object.entries(h).sort((a, b) => b[1] - a[1])[0];
  const idx = JUEGOS.findIndex((g) => g.nombre === (guardado || (ultimo && ultimo[0]))); sel = idx >= 0 ? idx : 0;
  aplicarIdioma(); pintar(); revisar(); setInterval(revisar, 30000); requestAnimationFrame(sondearMando);
  let visto = false; try { visto = sessionStorage.getItem("arranque") === "1"; sessionStorage.setItem("arranque", "1"); } catch (e) {}
  setTimeout(() => $("arranque").classList.add("fuera"), visto ? 0 : 1800);
  if (!leer("nombre", "")) setTimeout(abrirPerfil, visto ? 400 : 2400);
})();
</script>
